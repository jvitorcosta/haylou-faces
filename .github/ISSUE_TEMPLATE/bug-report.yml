name: Bug report
description: A face won't build, import or display
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: face
    attributes:
      label: Face
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Build output or error
      render: text
